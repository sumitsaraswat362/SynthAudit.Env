[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-audit-env"
version = "1.0.0"
description = "Multi-Agent Clinical AI Oversight Environment for OpenEnv"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Sumit Saraswat", email = "saraswatsumit070@gmail.com"}]

dependencies = [
    "openenv-core>=0.2.1",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
training = [
    "trl>=1.2.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "torch>=2.1.0",
    "accelerate>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["synth_audit_env*", "server*", "models*", "client*"]
